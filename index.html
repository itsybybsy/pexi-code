<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pexi Code</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/animation.css">

</head>

<body>

    <div class="container">
        <div class="welcome-page center">
            <h1>PEXI CODE</h1>

            <div class="cards-wrapper center">
                <div class="cards-grid">


                <div class="card card-p">
                    <div class="card-inner">
                        <div class="card-front">
                            <div class="keyboard center">
                                <span>P</span>
                            </div>
                        </div>
                        <div class="card-back"></div>
                    </div>
                </div>

                <div class="card card-e">
                    <div class="card-inner">
                        <div class="card-front"><span>E</span></div>
                        <div class="card-back"></div>
                    </div>
                </div>

                <div class="card card-x">
                    <div class="card-inner">
                        <div class="card-front"><span>X</span></div>
                        <div class="card-back"></div>
                    </div>
                </div>

                <div class="card card-i">
                    <div class="card-inner">
                        <div class="card-front">
                            <div class="keyboard center">
                                <span>I</span>
                            </div>
                        </div>
                        <div class="card-back"></div>
                    </div>
                </div>

                </div>
            </div>

            <div class="start-btn-wrapper">
                <a href="settings.html" class="start-btn">Get Started</a>
            </div>

        </div>      
    </div>
    
</body>
</html>
